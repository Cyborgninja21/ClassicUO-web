# nginx config for serving the ClassicUO-web WASM bundle.
# Single-threaded build → NO COOP/COEP headers needed (no SharedArrayBuffer).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WASM must be served as application/wasm or the browser refuses streaming compile.
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    # Compress the (large) wasm + framework assets.
    gzip on;
    gzip_types application/wasm application/javascript application/json application/octet-stream text/css text/html;
    gzip_min_length 1024;

    # Process-up probe for the container healthcheck + Traefik.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Content-hashed runtime assets are immutable — cache hard.
    location /_framework/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Entry + loader + build stamp change per deploy — never cache.
    location ~ ^/(index\.html|main\.js|build-info\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Operator-hosted UO art (Plan W7): a curated, read-only art set the operator
    # populates on the host (`task utumno-uo:web:load-art`), served so LAN players
    # get a zero-setup page (no folder pick). A MISSING file 404s HERE instead of
    # SPA-falling-back to index.html — so the client's manifest content-type guard
    # works and absent art cleanly falls back to the W5 OPFS folder picker.
    # manifest.json keeps application/json (inherited mime.types); the .mul/.uop
    # art blobs serve as application/octet-stream.
    location /uo-data/ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Everything else: serve if present, else fall back to the SPA entry.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
