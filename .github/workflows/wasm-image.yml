name: WASM client — image build

# Builds the ClassicUO-web WASM bundle with the frozen FNA-WASM-Build toolchain and
# packages it behind nginx -> ghcr.io/cyborgninja21/classicuo-web. The toolchain
# statics live in a durable fork Release (see build-wasm/fetch-statics.sh); the .NET
# SDK + statics are cached so only the ~5 min AOT compile runs each time.

on:
  push:
    branches: [web-wasm]
    paths:
      - "build-wasm/**"
      - "src/**"
      - "external/**"
      - ".github/workflows/wasm-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cyborgninja21/classicuo-web
  STATICS_TAG: toolchain-26933625837
  # GC-wedge fuse: fetch-statics.sh overlays a fuse-patched libmono-ee-interp.a from this
  # release onto the base pack (the pinned upstream pack predates patches/004). Bump to
  # invalidate the statics cache when the fuse lib changes.
  STATICS_FUSE_TAG: gcfuse-interp-004

jobs:
  build:
    runs-on: ubuntu-latest
    # 90: trimmed full-AOT compiles the reachable set on a 2-core runner (slower than the
    # 22-core local build). Untrimmed full-AOT OOM-killed at ~18min; trimming (TrimMode=partial)
    # shrinks the AOT set so it fits 7GB, but the serial 2-core AOT compile needs the headroom.
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ratchet gate for the wasm-AOT trap classes (threadpool reverse-pinvoke,
      # raw sockets, subprocess, sync-over-async). Fails fast — before the
      # expensive AOT build — on any NEW unguarded trap; the known desktop-only
      # findings live in the committed baseline. Tighten with --write-baseline
      # after fixing traps; never regenerate to absorb a regression.
      - name: WASM trap lint (ratchet gate)
        run: >-
          python3 build-wasm/tools/wasm-trap-lint.py --strict
          --baseline build-wasm/tools/wasm-trap-baseline.txt
          src/ClassicUO.Client

      - name: Cache toolchain statics
        uses: actions/cache@v4
        with:
          path: build-wasm/statics
          key: ${{ env.STATICS_TAG }}-${{ env.STATICS_FUSE_TAG }}

      - name: Cache .NET SDK + wasm-tools
        uses: actions/cache@v4
        with:
          path: build-wasm/.toolchain
          key: dotnet-toolchain-${{ hashFiles('build-wasm/install-dotnet.sh') }}

      - name: Apply submodule patches
        run: bash build-wasm/apply-patches.sh

      - name: Install .NET 10 SDK + wasm-tools
        run: bash build-wasm/install-dotnet.sh

      - name: Fetch toolchain statics (durable fork Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build-wasm/fetch-statics.sh

      - name: Build WASM bundle
        run: bash build-wasm/dev.sh build

      - name: Verify the GC fuse is compiled into the bundle
        run: |
          set -euo pipefail
          # The GC-wedge fuse lives in libmono-ee-interp.a, overlaid onto the runtime pack
          # by fetch-statics.sh (STATICS_FUSE_TAG / patches/004-mono-interp-lmf-gc-fuse). If
          # that overlay ever silently stops applying (STATICS_TAG bump, fetch failure, the
          # release asset deleted), the client would ship wedge-prone again. Fail loud here.
          WASM=$(ls build-wasm/loader/bin/Release/net10.0/publish/wwwroot/_framework/dotnet.native.*.wasm | head -1)
          if ! strings "$WASM" | grep -q 'gc-guard'; then
            echo "::error::GC fuse missing from $(basename "$WASM") — the libmono-ee-interp.a overlay did not apply. Refusing to ship a wedge-prone client."
            exit 1
          fi
          echo "GC fuse present in $(basename "$WASM") ✓"

      - name: Stage bundle for the image
        run: |
          set -euo pipefail
          PUB=build-wasm/loader/bin/Release/net10.0/publish/wwwroot
          test -f "$PUB/index.html" || { echo "no bundle at $PUB"; exit 1; }
          rm -rf build-wasm/deploy/wwwroot
          cp -r "$PUB" build-wasm/deploy/wwwroot
          echo "Bundle staged:"; ls -1 build-wasm/deploy/wwwroot | head

      # Crash symbolication (sprint 6.1): bake the wasm function map into the
      # bundle. Beacons carry raw wasm-function indices; the diag sidecar fetches
      # this map (same-origin with build-info.json, so it always matches the
      # served build) and resolves them to names in Loki. ~1-2 MB of text.
      - name: Emit the wasm function map
        run: |
          W=$(ls build-wasm/deploy/wwwroot/_framework/dotnet.native.*.wasm | head -1)
          build-wasm/statics/emsdk/emsdk/bin/wasm-opt --print-function-map --quiet "$W" \
            --enable-threads --enable-bulk-memory --enable-exception-handling --enable-multivalue \
            --enable-mutable-globals --enable-reference-types --enable-sign-ext --enable-simd \
            > build-wasm/deploy/wwwroot/_framework/dotnet.native.symbols.txt
          wc -l build-wasm/deploy/wwwroot/_framework/dotnet.native.symbols.txt

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: build-wasm/deploy
          file: build-wasm/deploy/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
