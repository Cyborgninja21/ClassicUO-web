name: WASM client — image build (RETIRED)

# RETIRED 2026-06-16: the WASM web client was consolidated into the canonical
# Cyborgninja21/Utumno-UO-web repo, which now builds + publishes the image as
# ghcr.io/cyborgninja21/utumno-uo-web. This repo stays public only to host the
# toolchain statics Release (build-wasm/fetch-statics.sh STATICS_REPO) and to
# track upstream ClassicUO. The push trigger is removed so this no longer
# publishes the stale classicuo-web image; kept as workflow_dispatch-only for
# emergency rebuilds of the old image during rollback.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cyborgninja21/classicuo-web
  # Single self-contained toolchain tag — the pack already contains the patch-004
  # GC-fuse runtime lib (sprint 6.3 de-overlay). The fuse-verify build step below
  # still gates every build, so a fuse-less pack can never ship silently.
  STATICS_TAG: toolchain-26933625837-fused004

jobs:
  build:
    runs-on: ubuntu-latest
    # 90: trimmed full-AOT compiles the reachable set on a 2-core runner (slower than the
    # 22-core local build). Untrimmed full-AOT OOM-killed at ~18min; trimming (TrimMode=partial)
    # shrinks the AOT set so it fits 7GB, but the serial 2-core AOT compile needs the headroom.
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ratchet gate for the wasm-AOT trap classes (threadpool reverse-pinvoke,
      # raw sockets, subprocess, sync-over-async). Fails fast — before the
      # expensive AOT build — on any NEW unguarded trap; the known desktop-only
      # findings live in the committed baseline. Tighten with --write-baseline
      # after fixing traps; never regenerate to absorb a regression.
      - name: WASM trap lint (ratchet gate)
        run: >-
          python3 build-wasm/tools/wasm-trap-lint.py --strict
          --baseline build-wasm/tools/wasm-trap-baseline.txt
          src/ClassicUO.Client

      - name: Cache toolchain statics
        uses: actions/cache@v4
        with:
          path: build-wasm/statics
          key: ${{ env.STATICS_TAG }}

      - name: Cache .NET SDK + wasm-tools
        uses: actions/cache@v4
        with:
          path: build-wasm/.toolchain
          key: dotnet-toolchain-${{ hashFiles('build-wasm/install-dotnet.sh') }}

      - name: Apply submodule patches
        run: bash build-wasm/apply-patches.sh

      - name: Install .NET 10 SDK + wasm-tools
        run: bash build-wasm/install-dotnet.sh

      - name: Fetch toolchain statics (durable fork Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build-wasm/fetch-statics.sh

      - name: Build WASM bundle
        run: bash build-wasm/dev.sh build

      - name: Verify the GC fuse is compiled into the bundle
        run: |
          set -euo pipefail
          # The GC-wedge fuse lives in libmono-ee-interp.a, overlaid onto the runtime pack
          # by the statics pack (patches/004-mono-interp-lmf-gc-fuse, baked into the
          # release). If a STATICS_TAG bump ever ships a fuse-less pack (upstream rebuild
          # without the patch, mirror mistake, the
          # release asset deleted), the client would ship wedge-prone again. Fail loud here.
          WASM=$(ls build-wasm/loader/bin/Release/net10.0/publish/wwwroot/_framework/dotnet.native.*.wasm | head -1)
          if ! strings "$WASM" | grep -q 'gc-guard'; then
            echo "::error::GC fuse missing from $(basename "$WASM") — the libmono-ee-interp.a overlay did not apply. Refusing to ship a wedge-prone client."
            exit 1
          fi
          echo "GC fuse present in $(basename "$WASM") ✓"

      - name: Stage bundle for the image
        run: |
          set -euo pipefail
          PUB=build-wasm/loader/bin/Release/net10.0/publish/wwwroot
          test -f "$PUB/index.html" || { echo "no bundle at $PUB"; exit 1; }
          rm -rf build-wasm/deploy/wwwroot
          cp -r "$PUB" build-wasm/deploy/wwwroot
          echo "Bundle staged:"; ls -1 build-wasm/deploy/wwwroot | head

      # Crash symbolication (sprint 6.1): ship the linker's function map next to
      # the bundle. WasmEmitSymbolMap (csproj) makes the SDK emit index:name even
      # in Release — the publish pipeline strips wasm name sections, so this side
      # file is the only reliable source (wasm-opt on the published binary yields
      # index:index). The diag sidecar fetches it same-origin with build-info.json
      # and resolves beacon wasm_frames to names in Loki.
      - name: Ship the wasm function map
        run: |
          SYM=build-wasm/loader/obj/Release/net10.0/wasm/for-publish/dotnet.native.js.symbols
          test -s "$SYM"   # hard-fail: a missing map means WasmEmitSymbolMap regressed
          cp "$SYM" build-wasm/deploy/wwwroot/_framework/dotnet.native.symbols.txt
          wc -l build-wasm/deploy/wwwroot/_framework/dotnet.native.symbols.txt

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: build-wasm/deploy
          file: build-wasm/deploy/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
